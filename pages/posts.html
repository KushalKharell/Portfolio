<header class="hero" style="padding:56px 0 40px;">
  <div class="wrap">
    <div class="eyebrow">POSTS</div>
    <h1 style="font-size:clamp(28px,4vw,40px);">Writing & video, together</h1>
    <p class="lede">Everything I publish — written notes and vlogs — in one feed.</p>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="post">Written</button>
      <button class="filter-btn" data-filter="video">Video</button>
    </div>
    <div class="posts-grid" id="posts-grid"></div>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span>© <span id="year"></span> Kushal Kharel</span>
    <div class="footer-links">
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:you@kushalkharel.com">Email</a>
    </div>
  </div>
</footer>

<script src="../js/main.js"></script>
<script src="../js/posts-data.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const grid = document.getElementById('posts-grid');
  const sorted = [...POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));

  function render(filter) {
    const items = filter === 'all' ? sorted : sorted.filter(p => p.kind === filter);
    grid.innerHTML = items.length
      ? items.map(p => renderPostCard(p, '../')).join('')
      : '<p style="color:var(--text-muted);">Nothing here yet.</p>';
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.filter);
    });
  });

  render('all');
</script>
</body>
</html>
